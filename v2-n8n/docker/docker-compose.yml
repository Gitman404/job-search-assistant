version: '3.8'

services:
  n8n:
    image: n8nio/n8n
    container_name: n8n-career-bot
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_USER_FOLDER=/home/node/.n8n
      - N8N_HOST=localhost
      - N8N_PORT=${N8N_PORT:-5678}
    volumes:
      - ./data:/home/node/.n8n
      - ../workflows:/home/node/workflows

      
      




